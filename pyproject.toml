[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-visionary"
version = "0.1.0"
description = "Offline-first image description and face indexing service"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
  "alembic>=1.13",
  "fastapi>=0.115",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
models = [
  "accelerate>=0.30",
  "huggingface-hub>=0.24",
  "insightface>=0.7.3",
  "onnxruntime>=1.18",
  "torch>=2.2",
  "transformers>=4.45,<5",
]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
eye-visionary-api = "eye_visionary.server:main"
eye-visionary-worker = "eye_visionary.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["eye_visionary*"]
