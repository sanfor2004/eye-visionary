[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-visionary"
version = "0.1.0"
description = "Offline-first image description and face indexing service"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
]

[project.optional-dependencies]
models = [
  "accelerate>=0.30",
  "huggingface-hub>=0.24",
  "insightface>=0.7.3",
  "onnxruntime>=1.18",
  "torch>=2.2",
  "transformers>=4.45,<5",
]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["eye_visionary*"]
